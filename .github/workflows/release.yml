name: Release

# Runs on every push to main. Most pushes are no-ops here: a release only
# actually happens when package.json's version doesn't yet have a matching
# git tag - so "bump the version and merge to main" is the entire release
# trigger, everything downstream (GitHub release, AUR, the PPA) fires
# automatically off of that. COPR and OBS aren't triggered from here at all -
# both are wired up as native GitHub repo webhooks (Settings > Webhooks),
# scoped to the `release` event, pointed directly at each service's own
# trigger URL. Tried curling those URLs from a job here first; both actually
# expect a real signed GitHub webhook delivery (COPR's even 500'd on a bare
# curl), not just a bare hit, so GitHub has to be the one calling them.
#
# Builds run on ubuntu-latest specifically because the rpm/deb packaging
# toolchain electron-builder bundles (fpm) is only compatible with the older
# rpmbuild shipped by that image - newer rpmbuild (as found on rolling-release
# distros) fails with a buildroot path mismatch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_new: ${{ steps.version.outputs.is_new }}
      has_aur: ${{ steps.optional.outputs.has_aur }}
      has_ppa: ${{ steps.optional.outputs.has_ppa }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already tagged - nothing to release."
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      # Whether each downstream publish target is configured, so those jobs
      # can no-op cleanly instead of failing when a secret hasn't been added
      # yet - each one gets wired up independently as its account/key exists.
      - id: optional
        run: |
          [ -n "${{ secrets.AUR_SSH_PRIVATE_KEY }}" ] && echo "has_aur=true" >> "$GITHUB_OUTPUT" || echo "has_aur=false" >> "$GITHUB_OUTPUT"
          [ -n "${{ secrets.PPA_GPG_PRIVATE_KEY }}" ] && echo "has_ppa=true" >> "$GITHUB_OUTPUT" || echo "has_ppa=false" >> "$GITHUB_OUTPUT"

      - name: Tag this release
        if: steps.version.outputs.is_new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      # COPR's rpkg build and OBS's obs_scm service both clone whatever's on main and read
      # Version: straight out of these spec files - unlike PKGBUILD (patched in publish-aur),
      # nothing else bumps these, so without this they'd silently keep building the version
      # that happened to be current when the spec was last hand-edited. debian/changelog is
      # the same story for the PPA: dpkg-buildpackage reads the version straight out of its
      # top entry, not from anywhere else - confirmed the hard way when a real 0.4.0 release
      # built and uploaded as "0.3.0-1" because this file was never actually touched.
      - name: Bump COPR/OBS/PPA version-tracking files
        if: steps.version.outputs.is_new == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^\(Version:[[:space:]]*\).*/\1$VERSION/" packaging/copr/noisitron.spec packaging/obs/noisitron.spec

          {
            echo "noisitron ($VERSION-1) noble; urgency=medium"
            echo
            echo "  * New upstream release."
            echo
            echo " -- leafyalex <alex.dial@outlook.com>  $(date -R)"
            echo
            cat packaging/ppa/debian/changelog
          } > /tmp/changelog.new
          mv /tmp/changelog.new packaging/ppa/debian/changelog

          git add packaging/copr/noisitron.spec packaging/obs/noisitron.spec packaging/ppa/debian/changelog
          git commit -m "Bump COPR/OBS/PPA version-tracking files to $VERSION" || true
          git push origin main

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run typecheck

      # `--publish never` is required, not optional: electron-builder infers "this is a
      # tagged CI build, I should publish to GitHub" from the environment itself (the git
      # remote + CI/tag detection), independent of whether a `publish:` block exists in
      # config or whether --publish was otherwise omitted. Without this flag it tries to
      # publish mid-build, before GH_TOKEN is set for this step, and fails outright.
      - name: Build Linux packages
        run: |
          npx electron-vite build
          npx electron-builder --linux AppImage deb rpm --publish never

      # electron-builder has no concept of the AppImageUpdate/GearLever update-info
      # convention, so the AppImage it produces isn't discoverable by those tools.
      # This re-packages it in place (same filename) with that info embedded, plus
      # the accompanying .zsync sidecar - see the script for details.
      - name: Embed AppImage update information
        run: bash scripts/embed-appimage-update-info.sh

      # A version-independent-named copy of the .deb, alongside the real versioned one -
      # OBS's download_url source service has no way to read %{version} out of a spec (each
      # <param> is a static string, no cross-service templating), so without a stable name to
      # point at, its _service file would need hand-editing on every single release forever.
      # GitHub's /releases/latest/download/<name> alias always resolves this to whatever the
      # newest release's asset is, so it never goes stale.
      - name: Add stable-named .deb copy
        run: cp dist/noisitron_${{ needs.check-version.outputs.version }}_amd64.deb dist/noisitron_amd64.deb

      # Published live (not draft): AUR/the PPA/COPR/OBS below all fetch this release's
      # assets by URL, which only resolve once it's actually public.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.check-version.outputs.version }}" \
            dist/*.AppImage dist/*.AppImage.zsync dist/*.deb dist/*.rpm \
            --title "${{ needs.check-version.outputs.version }}" --generate-notes

  publish-aur:
    needs: [check-version, build-linux]
    if: needs.check-version.outputs.is_new == 'true' && needs.check-version.outputs.has_aur == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update PKGBUILD/.SRCINFO for this version
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          curl -sSL -o /tmp/noisitron.deb \
            "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/noisitron_${VERSION}_amd64.deb"
          SHA="$(sha256sum /tmp/noisitron.deb | cut -d' ' -f1)"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/aur/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('$SHA')/" packaging/aur/PKGBUILD
          sed -i "s/^\(\s*pkgver = \).*/\1$VERSION/" packaging/aur/.SRCINFO
          sed -i "s/^\(\s*source = \).*/\1https:\/\/github.com\/${{ github.repository }}\/releases\/download\/v$VERSION\/noisitron_${VERSION}_amd64.deb/" packaging/aur/.SRCINFO
          sed -i "s/^\(\s*sha256sums = \).*/\1$SHA/" packaging/aur/.SRCINFO

      - uses: KSXGitHub/github-actions-deploy-aur@v4
        with:
          pkgname: noisitron-bin
          pkgbuild: packaging/aur/PKGBUILD
          assets: packaging/aur/.SRCINFO
          commit_username: leafyalex
          commit_email: alex.dial@outlook.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ needs.check-version.outputs.version }}"

  publish-ppa:
    needs: [check-version, build-linux]
    if: needs.check-version.outputs.is_new == 'true' && needs.check-version.outputs.has_ppa == 'true'
    runs-on: ubuntu-latest
    steps:
      # ref: main (not the default trigger SHA) on all three downstream jobs' checkouts -
      # check-version pushes its version-bump commit to main mid-run, *after* the SHA that
      # actually triggered this workflow, so a plain checkout here would silently miss it.
      # Reproduced for real: two releases in a row built/uploaded the *previous* version's
      # debian/changelog entry because this job never saw the bump that check-version made.
      - uses: actions/checkout@v4
        with:
          ref: main

      # build-essential is required even though nothing here actually compiles anything -
      # dpkg-checkbuilddeps treats it as an implicit baseline per Debian policy, and it's not
      # preinstalled on the runner image the way it would be on a real Debian/Ubuntu machine.
      # Reproduced for real: dpkg-checkbuilddeps errored "Unmet build dependencies:
      # build-essential:native" without this.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev debhelper dput gnupg build-essential

      - name: Import signing key
        run: echo "${{ secrets.PPA_GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Build and upload source package
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          bash packaging/ppa/build-source-package.sh "$VERSION"
          cd packaging/ppa/build/noisitron-$VERSION
          KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')"
          dpkg-buildpackage -S -sa -us -uc
          cd ..
          debsign -k"$KEYID" "noisitron_${VERSION}-1_source.changes"
          dput ppa:leafyalex/ppa-noisitron "noisitron_${VERSION}-1_source.changes"
