appId: dev.tippydial.noisitron
productName: Noisitron
copyright: Copyright © leafyalex
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: AudioVideo
  maintainer: leafyalex
  vendor: leafyalex
  synopsis: Soundboard that mixes clips into a virtual mic for Discord
  description: >-
    Noisitron mixes local audio clips into a virtual PulseAudio/PipeWire
    microphone so Discord (or any other app) hears them alongside your
    voice, while you monitor playback through your headphones.
deb:
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
rpm:
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
# No `publish:` block: releasing is handled explicitly by the workflow's own
# `gh release create` step (after the AppImage update-info post-processing runs), not by
# electron-builder's built-in publisher. Leaving a `publish:` config here - even without
# ever passing --publish - makes electron-builder auto-detect "CI + a tag build" and try to
# publish during the build step itself, before GH_TOKEN is even set for that step.
